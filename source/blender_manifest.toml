schema_version = "1.0.0"

id            = "struct_topo_opt"
version       = "0.5.0"
name          = "Structural Topology Optimization"
tagline       = "Free topology optimization in Blender for load-bearing forms"
maintainer    = "Emre Ergin <emrgn.arch@gmail.com>"
type          = "add-on"

blender_version_min = "4.2.0"

license    = ["SPDX:GPL-3.0-or-later"]
copyright  = [
    "2024 Emre Ergin",
]
website = "https://github.com/emrgn-arch/StructTopOpt_Blender"
tags    = ["Mesh", "Physics"]

platforms = ["windows-x64", "linux-x64", "macos-arm64"]

[build]
paths_exclude_pattern = [
    "__pycache__/",
    "*.pyc",
    "*.zip",
    "*.blend",
]
